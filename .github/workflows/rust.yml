name: Rust

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The Skia build script treats this as one executable path, not a shell
  # command string. The wrapper below enforces bounded Ninja parallelism.
  SKIA_NINJA_COMMAND: /usr/local/bin/ninja-quota-re

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust and Skia build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install Skia and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev python3 libfontconfig1-dev libfreetype6-dev ninja-build fontconfig fonts-roboto fonts-noto-core fonts-noto-color-emoji
          command -v ninja
          ninja --version
          sudo tee /usr/local/bin/ninja-quota-re >/dev/null <<'EOF'
          #!/bin/sh
          exec /usr/bin/ninja -j 2 "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/ninja-quota-re
          /usr/local/bin/ninja-quota-re --version

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
