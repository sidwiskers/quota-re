name: Rust

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Skia Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang python3 libfontconfig1-dev libfreetype6-dev ninja-build

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
