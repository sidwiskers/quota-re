name: Rust

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SKIA_NINJA_COMMAND: "ninja -j 2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust and Skia build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install Skia and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang python3 libfontconfig1-dev libfreetype6-dev ninja-build fontconfig fonts-roboto fonts-noto-core fonts-noto-color-emoji

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
