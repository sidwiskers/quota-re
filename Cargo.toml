[package]
name = "quota-re"
version = "0.1.0"
edition = "2021"
description = "Quote Engine rewritten in Rust using Skia"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.37", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "limit"] }
skia-safe = { version = "0.153", features = ["textlayout", "webp-encode", "jpeg"] }
serde_json = "1.0"
bytes = "1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
