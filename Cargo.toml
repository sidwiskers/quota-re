[package]
name = "quota-re"
version = "0.1.0"
edition = "2021"
description = "Quote Engine re-written in Rust using Skia"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.37", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "limit", "cors"] }

# Rendering Engine (Skia)
skia-safe = { version = "0.153", features = ["textlayout", "webp-encode", "jpeg"] }

# Serialization & HTTP
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
bytes = "1.5"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
hex = "0.4"
